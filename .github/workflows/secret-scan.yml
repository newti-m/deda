name: secret-scan
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  ansible-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vault + key guards
        run: |
          chmod +x scripts/*.sh
          git ls-files -z '*vault.yml' '*.vault' | xargs -0 -r scripts/check-vault-encrypted.sh
          git ls-files -z | xargs -0 -r scripts/check-no-private-keys.sh
